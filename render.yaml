
## 11. ملف `render.yaml` - لنشر سريع على Render (اختياري)

```yaml
services:
  - type: web
    name: all-arab-services
    runtime: node
    repo: https://github.com/your-repo/all-arab-services
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: NODE_ENV
        value: production
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true