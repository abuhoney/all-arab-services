<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل_نقاط</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { font-family: 'Cairo', sans-serif; }
        body { background: #f0f2f5; }
        .card-hover { transition: all 0.2s; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="max-w-md mx-auto p-4">
        <div class="bg-white rounded-2xl shadow-lg p-6">
            <div class="text-center mb-6">
                <i class="fa-solid fa-money-bill-wave text-4xl text-yellow-500"></i>
                <h1 class="text-2xl font-bold mt-2">تحويل_نقاط</h1>
                <p class="text-slate-500">انقل_نقاطك_بسهولة</p>
            </div>
            <div id="content">
                <div class="text-center p-4"><div class="bg-blue-50 p-3 rounded-xl mb-4"><p class="text-sm">رصيدك</p><p class="text-3xl font-bold text-blue-600" id="balance">0</p></div><input type="text" id="to" class="w-full border rounded-xl p-2 mb-2" placeholder="معرف المستلم"><input type="number" id="amount" class="w-full border rounded-xl p-2 mb-2" placeholder="المبلغ"><button onclick="sendTransfer()" class="bg-green-500 text-white p-2 rounded-xl w-full">تحويل</button><div id="msg"></div></div>
            </div>
        </div>
        <div class="mt-4 text-center">
            <a href="/" class="text-teal-600 text-sm">← العودة للرئيسية</a>
        </div>
    </div>
    <script src="/transfer.js"></script>
</body>
</html>
