<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>منصة الخدمات المتكاملة | All Arab Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
        * { font-family: 'Cairo', sans-serif; }
        .card-hover { transition: all 0.2s; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .image-preview { background-size: cover; background-position: center; }
        .modal-backdrop { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 24px; max-width: 90%; width: 500px; max-height: 90vh; overflow-y: auto; padding: 20px; }
        .cropper-container { max-height: 400px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .offline-banner { background: #f59e0b; color: white; text-align: center; padding: 8px; font-size: 12px; position: fixed; top: 0; left: 0; right: 0; z-index: 100; }
        .nav-btn.active { color: #2563eb; }
        .toast { animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100">

    <div id="offlineBanner" class="offline-banner hidden">
        <i class="fa-solid fa-wifi-slash"></i> أنت الآن أوفلاين - البيانات المحفوظة تعمل
    </div>

    <div id="loader" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center">
        <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-3"></div>
        <h2 class="text-xl font-bold">منصة الخدمات</h2>
        <p class="text-slate-500" id="loaderText">جاري التحميل...</p>
        <p class="text-xs text-slate-400 mt-4" id="loaderDetail">جاري التحقق من الاتصال</p>
    </div>

    <div id="app" class="max-w-5xl mx-auto h-screen flex flex-col hidden">
        <header class="bg-white shadow-md px-4 py-3 sticky top-0 z-30 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-cubes text-2xl text-blue-600"></i>
                <h1 class="text-xl font-bold">منصة الخدمات</h1>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="showNotificationsModal()" class="relative">
                    <i class="fa-solid fa-bell text-xl text-slate-600"></i>
                    <span id="notifBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center hidden"></span>
                </button>
                <div class="bg-amber-100 text-amber-700 px-3 py-1 rounded-full text-sm flex items-center gap-1">
                    <i class="fa-solid fa-coins"></i> <span id="points">0</span>
                </div>
                <button id="profileBtn" class="w-10 h-10 bg-slate-200 rounded-full flex items-center justify-center"><i class="fa-solid fa-user text-slate-600"></i></button>
                <button id="adminBtn" class="w-10 h-10 bg-red-100 rounded-full flex items-center justify-center hidden"><i class="fa-solid fa-shield-halved text-red-600"></i></button>
            </div>
        </header>

        <div class="bg-white px-4 pb-3 shadow-sm">
            <div class="relative">
                <i class="fa-solid fa-search absolute right-4 top-3 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن منشأة، منتج، خدمة..." class="w-full bg-gray-100 border-none rounded-full py-3 pr-12 pl-4 focus:ring-2 focus:ring-blue-500">
            </div>
        </div>

        <main id="mainContent" class="flex-1 overflow-y-auto p-4"></main>

        <nav class="bg-white shadow-inner sticky bottom-0 grid grid-cols-5 text-center py-2 border-t">
            <button data-page="home" class="nav-btn flex flex-col items-center justify-center text-blue-600"><i class="fa-solid fa-house text-xl"></i><span class="text-xs">الرئيسية</span></button>
            <button data-page="categories" class="nav-btn flex flex-col items-center justify-center text-slate-500"><i class="fa-solid fa-table-cells-large text-xl"></i><span class="text-xs">الأقسام</span></button>
            <button id="addBtn" class="bg-blue-600 text-white rounded-full w-14 h-14 -mt-6 shadow-lg mx-auto flex items-center justify-center border-4 border-gray-100"><i class="fa-solid fa-plus text-2xl"></i></button>
            <button data-page="favorites" class="nav-btn flex flex-col items-center justify-center text-slate-500"><i class="fa-solid fa-heart text-xl"></i><span class="text-xs">المفضلة</span></button>
            <button data-page="myServices" class="nav-btn flex flex-col items-center justify-center text-slate-500"><i class="fa-solid fa-box text-xl"></i><span class="text-xs">خدماتي</span></button>
        </nav>
        
        <!-- أزرار إضافية أسفل الناف -->
        <div class="grid grid-cols-2 gap-2 py-2 px-4 bg-white border-t text-xs">
            <button onclick="showInstructions()" class="bg-blue-50 text-blue-600 py-2 rounded-xl"><i class="fa-solid fa-circle-question"></i> التعليمات</button>
            <button onclick="showPrivacyPolicy()" class="bg-slate-50 text-slate-600 py-2 rounded-xl"><i class="fa-solid fa-shield-halved"></i> الخصوصية</button>
        </div>
    </div>

    <div id="modalRoot"></div>
    <div id="toastRoot" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-50"></div>

    <script type="module">
        // ======================== Firebase Configuration ========================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-analytics.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, query, where, orderBy, limit, onSnapshot, enableIndexedDbPersistence, serverTimestamp, updateDoc, arrayUnion, arrayRemove, increment, deleteDoc } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js';
        import { getAuth, signInAnonymously, onAuthStateChanged, updateProfile } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js';
        import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js';
        
        // Firebase configuration from config.py
        const firebaseConfig = {
            apiKey: "AIzaSyBm-ZwOv8oPd_0rms_2oesGz3fDmt5ogvA",
            authDomain: "all-arab-services-750ad.firebaseapp.com",
            databaseURL: "https://all-arab-services-750ad-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "all-arab-services-750ad",
            storageBucket: "all-arab-services-750ad.firebasestorage.app",
            messagingSenderId: "1002499268790",
            appId: "1:1002499268790:web:9437bee4f4df9f93adc617",
            measurementId: "G-5YLWVFPW60"
        };
        
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const storage = getStorage(app);
        
        // Enable offline persistence
        enableIndexedDbPersistence(db).catch((err) => {
            if (err.code == 'failed-precondition') {
                console.log('Multiple tabs open, persistence failed');
            } else if (err.code == 'unimplemented') {
                console.log('Browser does not support persistence');
            }
        });
        
        // Global variables
        window.db = db;
        window.auth = auth;
        window.storage = storage;
        window.serverTimestamp = serverTimestamp;
        
        // App Variables
        let currentUser = null;
        let allServices = [];
        let allCategories = [];
        let isOnline = navigator.onLine;
        let favorites = [];
        let currentPage = 'home';
        let allCoupons = [];
        
        const APP_VERSION = '2.0.0';
        const ADMIN_WHATSAPP = "967773458975";
        
        const CATEGORIES = [
            { id: "health", name: "🏥 صحة ومستشفيات", icon: "fa-hospital-user", color: "blue" },
            { id: "finance", name: "💰 خدمات مالية", icon: "fa-chart-line", color: "green" },
            { id: "hotels", name: "🏨 فنادق وسياحة", icon: "fa-hotel", color: "purple" },
            { id: "restaurants", name: "🍽️ مطاعم", icon: "fa-utensils", color: "orange" },
            { id: "fashion", name: "👗 ملابس وأزياء", icon: "fa-shirt", color: "pink" },
            { id: "realestate", name: "🏠 عقارات", icon: "fa-building", color: "red" },
            { id: "education", name: "📚 تعليم", icon: "fa-graduation-cap", color: "indigo" },
            { id: "services", name: "🛠️ خدمات عامة", icon: "fa-wrench", color: "slate" }
        ];
        
        const CURRENCIES = [
            { code: "YER", symbol: "ر.ي", name: "ريال يمني", rate: 1 },
            { code: "SAR", symbol: "ر.س", name: "ريال سعودي", rate: 0.015 },
            { code: "USD", symbol: "$", name: "دولار أمريكي", rate: 0.004 }
        ];
        
        // ======================== Helper Functions ========================
        function showToast(msg, type = "success") {
            const toast = document.createElement("div");
            toast.className = `toast px-4 py-3 rounded-xl shadow-lg text-white text-sm ${type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500'} transition-all duration-300 z-50`;
            toast.innerHTML = `<i class="fa-${type === 'success' ? 'solid fa-check' : type === 'error' ? 'solid fa-exclamation' : 'solid fa-info'} ml-2"></i>${msg}`;
            document.getElementById("toastRoot").innerHTML = "";
            document.getElementById("toastRoot").appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        function showModal(content) {
            const modalDiv = document.createElement('div');
            modalDiv.className = 'modal-backdrop';
            modalDiv.innerHTML = `<div class="modal-content relative">${content}<button onclick="this.closest('.modal-backdrop').remove()" class="absolute top-2 left-2 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-times"></i></button></div>`;
            modalDiv.onclick = (e) => { if (e.target === modalDiv) modalDiv.remove(); };
            document.getElementById("modalRoot").innerHTML = "";
            document.getElementById("modalRoot").appendChild(modalDiv);
            return modalDiv;
        }
        
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            showToast('تم النسخ 📋', 'success');
        }
        
        function formatDate(timestamp) {
            if (!timestamp) return 'غير محدد';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleDateString('ar-EG');
        }
        
        // ======================== Encryption & Device ID ========================
        const SECRET_SALT = 'ALL_ARAB_SERVICES_SECURE_SALT_2024_V2';
        
        async function generateSecureDeviceId() {
            const fp = navigator.userAgent + screen.width + screen.height + navigator.language + navigator.platform + screen.colorDepth + navigator.hardwareConcurrency;
            const encoder = new TextEncoder();
            const data = encoder.encode(fp + SECRET_SALT);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }
        
        function encryptData(data) {
            try {
                return btoa(encodeURIComponent(JSON.stringify(data)));
            } catch { return null; }
        }
        
        function decryptData(encrypted) {
            try {
                return JSON.parse(decodeURIComponent(atob(encrypted)));
            } catch { return null; }
        }
        
        // ======================== Online/Offline Handlers ========================
        window.addEventListener('online', () => {
            isOnline = true;
            document.getElementById('offlineBanner').classList.add('hidden');
            showToast('✅ تم استعادة الاتصال', 'success');
            loadData();
            syncPendingData();
        });
        
        window.addEventListener('offline', () => {
            isOnline = false;
            document.getElementById('offlineBanner').classList.remove('hidden');
            showToast('⚠️ أنت أوفلاين - الوضع المحلي مفعل', 'info');
        });
        
        async function syncPendingData() {
            const pending = JSON.parse(localStorage.getItem('pending_sync') || '[]');
            if (pending.length === 0) return;
            showToast(`جاري مزامنة ${pending.length} عنصر...`, 'info');
            for (const item of pending) {
                try {
                    if (item.type === 'service') {
                        await window.createServiceWithImage(item.data, item.imageBlob);
                    }
                } catch (e) { console.error('Sync failed:', e); }
            }
            localStorage.removeItem('pending_sync');
        }
        
        // ======================== User Initialization ========================
        async function initUser() {
            document.getElementById('loaderText').innerText = 'جاري التحقق من الهوية...';
            const deviceId = await generateSecureDeviceId();
            
            return new Promise((resolve) => {
                onAuthStateChanged(auth, async (firebaseUser) => {
                    if (!firebaseUser) {
                        await signInAnonymously(auth);
                        return;
                    }
                    
                    const userRef = doc(db, 'users', firebaseUser.uid);
                    const userSnap = await getDoc(userRef);
                    
                    if (userSnap.exists()) {
                        currentUser = userSnap.data();
                        if (currentUser.deviceId !== deviceId) {
                            currentUser.deviceId = deviceId;
                            await setDoc(userRef, currentUser, { merge: true });
                        }
                    } else {
                        const urlParams = new URLSearchParams(window.location.search);
                        const refCode = urlParams.get('ref');
                        
                        currentUser = {
                            uid: firebaseUser.uid,
                            deviceId: deviceId,
                            name: "زائر جديد",
                            phone: "",
                            email: "",
                            avatar: null,
                            points: 100,
                            role: "user",
                            referralCode: deviceId.substr(-8).toUpperCase(),
                            referredBy: refCode || null,
                            totalReferrals: 0,
                            totalReferralEarnings: 0,
                            walletFrozen: false,
                            createdAt: serverTimestamp(),
                            lastLogin: serverTimestamp(),
                            appVersion: APP_VERSION,
                            fcmToken: null
                        };
                        await setDoc(userRef, currentUser);
                        
                        if (refCode) {
                            try {
                                await fetch(`${API_URL}/api/referral/track`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ newUserId: firebaseUser.uid, referralCode: refCode })
                                });
                            } catch(e) { console.log('Referral track failed:', e); }
                        }
                        
                        showToast("👋 مرحباً بك! تم إضافة 100 نقطة ترحيبية", "success");
                    }
                    
                    document.getElementById("points").innerText = currentUser.points;
                    if (currentUser.role === 'admin') document.getElementById('adminBtn').classList.remove('hidden');
                    resolve();
                });
            });
        }
        
        // ======================== Load Data ========================
        async function loadData() {
            document.getElementById('loaderText').innerText = 'جاري تحميل الخدمات...';
            
            try {
                const servicesQuery = query(
                    collection(db, 'services'), 
                    where('status', '==', 'approved'),
                    orderBy('createdAt', 'desc'),
                    limit(100)
                );
                const snapshot = await getDocs(servicesQuery);
                allServices = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                localStorage.setItem('cached_services', encryptData(allServices));
            } catch (error) {
                console.error('Load data error:', error);
                const cached = localStorage.getItem('cached_services');
                if (cached) allServices = decryptData(cached) || [];
            }
            
            // Load favorites from localStorage
            const savedFavs = localStorage.getItem(`favorites_${currentUser?.uid}`);
            if (savedFavs) favorites = JSON.parse(savedFavs);
        }
        
        // ======================== Render Functions ========================
        function renderServiceCard(service) {
            const isFav = favorites.includes(service.id);
            const currencySym = CURRENCIES.find(c => c.code === service.currency)?.symbol || 'ر.ي';
            const hasDiscount = service.discountPercent && service.discountPercent > 0;
            const finalPrice = hasDiscount ? service.price : service.basePrice;
            
            return `
                <div class="bg-white rounded-xl shadow-md overflow-hidden card-hover cursor-pointer" onclick="viewService('${service.id}')">
                    <div class="relative">
                        <img src="${service.image || 'https://placehold.co/400x300'}" class="w-full h-36 object-cover" onerror="this.src='https://placehold.co/400x300'">
                        ${hasDiscount ? `<div class="absolute top-2 right-2 bg-red-500 text-white text-xs px-2 py-1 rounded-full">-${service.discountPercent}%</div>` : ''}
                        <button onclick="event.stopPropagation(); toggleFavorite('${service.id}')" class="absolute top-2 left-2 w-8 h-8 bg-white rounded-full flex items-center justify-center shadow-md">
                            <i class="fa-${isFav ? 'solid' : 'regular'} fa-heart ${isFav ? 'text-red-500' : 'text-gray-400'}"></i>
                        </button>
                    </div>
                    <div class="p-3">
                        <p class="text-xs text-blue-600 truncate">${service.establishment || 'غير محدد'}</p>
                        <h3 class="font-semibold text-sm truncate">${service.productName || 'غير محدد'}</h3>
                        <div class="flex items-center gap-2 mt-1">
                            <p class="text-green-600 font-bold text-sm">${finalPrice} ${currencySym}</p>
                            ${hasDiscount ? `<p class="text-xs text-slate-400 line-through">${service.basePrice} ${currencySym}</p>` : ''}
                        </div>
                        <div class="flex items-center gap-1 mt-1">
                            <i class="fa-solid fa-star text-yellow-500 text-xs"></i>
                            <span class="text-xs text-slate-600">${service.avgRating?.toFixed(1) || 'جديد'}</span>
                        </div>
                    </div>
                </div>
            `;
        }
        
        window.renderHome = () => {
            const featured = allServices.filter(s => (s.avgRating || 0) >= 4).slice(0, 6);
            const discounts = allServices.filter(s => s.discountPercent > 0).slice(0, 6);
            const recent = allServices.slice(0, 8);
            
            const html = `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-blue-500 to-purple-600 text-white p-5 rounded-2xl">
                        <h2 class="text-2xl font-bold mb-1">مرحباً ${currentUser?.name || 'زائر'} 👋</h2>
                        <p class="text-sm opacity-90">رصيدك: ${currentUser?.points || 0} نقطة</p>
                        ${currentUser?.role === 'user' ? `
                            <button onclick="requestUpgrade()" class="bg-white text-blue-600 px-4 py-2 rounded-full text-sm mt-3 font-bold transition hover:bg-gray-100">
                                ⬆️ ترقية لحساب مميز
                            </button>
                        ` : ''}
                    </div>
                    
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-lg">🗂️ تصفح الأقسام</h3>
                        </div>
                        <div class="grid grid-cols-4 gap-3">
                            ${CATEGORIES.slice(0, 8).map(c => `
                                <button onclick="filterByCategory('${c.id}')" class="bg-white p-3 rounded-xl shadow text-center hover:shadow-md transition">
                                    <i class="fa-solid ${c.icon} text-xl text-${c.color}-600 mb-1"></i>
                                    <p class="text-xs font-bold">${c.name.split(' ')[1] || c.name}</p>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                    
                    ${discounts.length > 0 ? `
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-lg">🔥 عروض وخصومات</h3>
                            <button onclick="showDiscountedServices()" class="text-blue-600 text-sm">عرض الكل →</button>
                        </div>
                        <div class="flex gap-3 overflow-x-auto pb-2">
                            ${discounts.map(s => `
                                <div class="min-w-[180px] bg-white rounded-xl shadow overflow-hidden cursor-pointer" onclick="viewService('${s.id}')">
                                    <div class="relative">
                                        <img src="${s.image}" class="w-full h-28 object-cover" onerror="this.src='https://placehold.co/400x300'">
                                        <div class="absolute top-2 right-2 bg-red-500 text-white text-xs px-2 py-1 rounded-full">-${s.discountPercent}%</div>
                                    </div>
                                    <div class="p-2">
                                        <p class="text-xs font-bold truncate">${s.productName}</p>
                                        <p class="text-green-600 font-bold text-sm">${s.price} ${CURRENCIES.find(c => c.code === s.currency)?.symbol || ''}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}
                    
                    ${featured.length > 0 ? `
                    <div>
                        <h3 class="font-bold text-lg mb-3">⭐ الأعلى تقييماً</h3>
                        <div class="grid grid-cols-2 gap-3">
                            ${featured.map(s => renderServiceCard(s)).join('')}
                        </div>
                    </div>
                    ` : ''}
                    
                    <div>
                        <h3 class="font-bold text-lg mb-3">✨ أضيف حديثاً</h3>
                        <div class="grid grid-cols-2 gap-3">
                            ${recent.map(s => renderServiceCard(s)).join('')}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById("mainContent").innerHTML = html;
            setActiveNav("home");
            currentPage = "home";
        };
        
        window.renderCategories = () => {
            const html = `
                <h2 class="font-bold text-xl mb-4">📂 جميع الأقسام</h2>
                <div class="grid grid-cols-2 gap-3">
                    ${CATEGORIES.map(c => `
                        <button onclick="filterByCategory('${c.id}')" class="bg-white p-4 rounded-xl shadow text-center hover:shadow-md transition">
                            <i class="fa-solid ${c.icon} text-3xl text-${c.color}-600 mb-2"></i>
                            <p class="font-bold">${c.name}</p>
                            <p class="text-xs text-slate-500 mt-1">${allServices.filter(s => s.category_id === c.id).length} خدمة</p>
                        </button>
                    `).join('')}
                </div>
            `;
            document.getElementById("mainContent").innerHTML = html;
            setActiveNav("categories");
            currentPage = "categories";
        };
        
        window.renderMyServices = async () => {
            if (!currentUser) { showToast('الرجاء تسجيل الدخول', 'error'); return; }
            
            const myServices = allServices.filter(s => s.userId === currentUser.uid);
            const pendingServices = myServices.filter(s => s.status === 'pending');
            const approvedServices = myServices.filter(s => s.status === 'approved');
            const rejectedServices = myServices.filter(s => s.status === 'rejected');
            
            const html = `
                <h2 class="font-bold text-xl mb-4">📦 خدماتي</h2>
                <div class="bg-blue-50 p-3 rounded-xl mb-4 text-center">
                    <p class="text-sm">📊 إجمالي خدماتك: ${myServices.length}</p>

                if (file.size > 5 * 1024 * 1024) {
                    showToast('حجم الصورة يجب أن يكون أقل من 5MB', 'error');
                    return;
                }
                const reader = new FileReader();

                    showModal(`
                        <h3 class="font-bold text-lg mb-3">✂️ قص الصورة</h3>

                    `);
                    const img = document.getElementById('cropImage');
                    if (cropper) cropper.destroy();
                    cropper = new Cropper(img, {
                        aspectRatio: 1,
                        viewMode: 1,
                        autoCropArea: 0.8,
                        background: false
                    });
                    document.getElementById('applyCropBtn').onclick = () => {
                        const canvas = cropper.getCroppedCanvas({ width: 800, height: 800 });

                            onCropped(blob);
                            document.querySelector(".modal-backdrop").remove();

                <h3 class="font-bold text-xl mb-4">📖 تعليمات الاستخدام</h3>
                <div class="space-y-3 text-sm">
                    <div class="bg-blue-50 p-3 rounded-lg"><p class="font-bold">🎯 كيف تحجز منتج؟</p><ol class="list-decimal list-inside"><li>اختر المنتج المطلوب</li><li>اضغط "حجز المنتج"</li><li>يخصم 15% كنقاط عربون</li><li>تواصل مع البائع عبر واتساب</li></ol></div>
                    <div class="bg-green-50 p-3 rounded-lg"><p class="font-bold">💎 كيف تكسب نقاط؟</p><ul class="list-disc list-inside"><li>+100 نقطة عند التسجيل</li><li>+10 نقاط عند إضافة خدمة</li><li>+50 نقطة لكل صديق يسجل بكودك</li><li>+5 نقاط عند تقييم منتج</li></ul></div>
                </div>
            `);
        };
        
        window.showPrivacyPolicy = () => {
            showModal(`
                <h3 class="font-bold text-xl mb-4">🔒 سياسة الخصوصية</h3>
                <div class="space-y-2 text-sm">
                    <p>نجمع: الاسم، رقم الجوال، الصور. لا نشارك بياناتك مع طرف ثالث.</p>
                    <p>البيانات مشفرة في Firebase. لا نخزن كلمات مرور.</p>
                    <p>التطبيق يحفظ نسخة مشفرة من بياناتك على جهازك.</p>
                    <p class="bg-blue-50 p-2 rounded-lg mt-3">📞 للاستفسار: واتساب ${ADMIN_WHATSAPP}</p>
                </div>
            `);
        };
        
        // ======================== Real-time Listeners ========================
        let userDataUnsubscribe = null;
        
        function initRealtimeListeners() {
            if (userDataUnsubscribe) userDataUnsubscribe();
            if (!currentUser) return;
            
            userDataUnsubscribe = onSnapshot(doc(db, 'users', currentUser.uid), (doc) => {
                if (!doc.exists()) return;
                const newData = doc.data();
                const oldPoints = currentUser.points;
                currentUser = { ...currentUser, ...newData };
                if (newData.points !== oldPoints) {
                    const diff = newData.points - oldPoints;
                    if (diff > 0) showToast(`💎 +${diff} نقطة`, 'success');
                    document.getElementById("points").innerText = currentUser.points;
                }
                if (newData.role !== currentUser.role) {
                    showToast(`🎉 تمت ترقيتك إلى ${newData.role === 'premium_user' ? 'عضو مميز' : 'منشأة مميزة'}!`, 'success');
                    if (currentUser.role === 'admin') document.getElementById('adminBtn').classList.remove('hidden');
                }
            });
        }
        
        // ======================== Start App ========================
        async function startApp() {
            try {
                await initUser();
                await loadData();
                initRealtimeListeners();
                
                document.getElementById("loader").style.display = "none";
                document.getElementById("app").classList.remove("hidden");
                renderHome();
                
                if (isOnline) syncPendingData();
            } catch (error) {
                console.error('Start failed:', error);
                const cached = localStorage.getItem('cached_services');
                if (cached) {
                    allServices = decryptData(cached) || [];
                    document.getElementById("loader").style.display = "none";
                    document.getElementById("app").classList.remove("hidden");
                    renderHome();
                    showToast('تم التحميل من النسخة المحفوظة', 'info');
                } else {
                    document.getElementById('loaderText').innerText = 'فشل التحميل. تأكد من الاتصال';
                }
            }
        }
        
        startApp();
    </script>
</body>
</html>
