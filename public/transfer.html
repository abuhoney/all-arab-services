<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل_النقاط</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { font-family: 'Cairo', sans-serif; }
        body { background: #f0f2f5; }
        .card-hover { transition: all 0.2s; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="max-w-md mx-auto p-4">
        <div class="bg-white rounded-2xl shadow-lg p-6">
            <div class="text-center mb-6">
                <i class="fa-solid fa-exchange-alt text-4xl text-green-500"></i>
                <h1 class="text-2xl font-bold mt-2">تحويل_النقاط</h1>
                <p class="text-slate-500">حول_نقاطك_لأصدقائك</p>
            </div>
            <div id="pageContent">
                <p class='text-center text-slate-500'>محتوى الصفحة قيد الإنشاء...</p>
            </div>
        </div>
        <div class="mt-4 text-center">
            <a href="/" class="text-teal-600 text-sm">← العودة للرئيسية</a>
        </div>
    </div>
    <script>
        const API_URL = window.location.origin;
        const PAGE_ID = 'transfer';
        
        
async function loadPageData() {
    try {
        const response = await fetch(`${API_URL}/api/page-data/transfer`);
        const data = await response.json();
        if (data.success) {
            document.getElementById('pageContent').innerHTML = data.html;
        }
    } catch(e) {
        console.error(e);
    }
}

        
        // تحميل البيانات تلقائياً
        if (typeof loadPageData === 'function') {
            loadPageData();
        }
    </script>
</body>
</html>
