<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل_النقاط</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { font-family: 'Cairo', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .glass-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); }
        .btn-animate { transition: all 0.3s ease; }
        .btn-animate:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2); }
        .loading { opacity: 0.7; pointer-events: none; }
    </style>
</head>
<body class="p-4">
    <div class="max-w-md mx-auto">
        <div class="glass-card rounded-2xl shadow-2xl p-6">
            <div class="text-center mb-6">
                <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fa-solid fa-exchange-alt text-3xl text-green-600"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">تحويل_النقاط</h1>
                <p class="text-gray-500 text-sm">مرحباً بك في خدمة تحويل_النقاط</p>
            </div>
            
            <div id="content" class="space-y-4">
                <div class="bg-gray-50 rounded-xl p-4 text-center">
                    <div class="animate-pulse">
                        <i class="fa-solid fa-spinner fa-spin text-green-500 text-2xl"></i>
                        <p class="text-gray-500 mt-2">جاري التحميل...</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="text-center mt-4">
            <a href="/" class="text-white text-sm opacity-75 hover:opacity-100">← العودة للرئيسية</a>
        </div>
    </div>
    
    <script src="/points_transfer.js"></script>
</body>
</html>
